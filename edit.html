    <h1 id="ert"></h1>
  
          <div id="canvas-container"></div>

    <script>
idid=parent.document.URL.substring(parent.document.URL.indexOf('?')+4, parent.document.URL.length);
file=localStorage.getItem("maps").split('杧杧杧')[idid]
      if (file.includes("yours")==false){
        location.href="view.html?id="idid
      }

document.getElementById("ed").href="new.html?id="+idid
document.getElementById("view").href="view.html?id="+idid
      
      document.getElementById("ert").innerHTML="Editing "+'"'+file.split("޶޶޶")[0]+'"'
function preload(){
   soundFormats('mp3', 'ogg');
  if(file.split("޶޶޶")[3].split("|||")[0]!=""){
  mySound = loadSound(file.split("޶޶޶")[3].split("|||")[0].replace("/raw","").replace("github.com","raw.githubusercontent.com"))
  }
}
function setup() {
prevstates=[]
nest=0
  scalee=(window.innerWidth)/1000
  canvas= createCanvas(1000*scalee, 300*scalee);
    canvas.parent('canvas-container');
    canvas.style('display', 'block');

  
  word=file.split("޶޶޶")[4].slice(0,-6)
  att=word.split("").map(item=>item.codePointAt(0)-1)
  patt=[]
  cumu=0
  all=0
  for (h in att){
    cumu+=att[h]
    all+=att[h]
    if (att[h]!=0&&att[h*1+1]!=0){
    patt.push(cumu)
      cumu=0
    }
  }
  summ=0
  cumulat=patt.map(num=>summ+=num)
  zoom=3
  temp=[]
  temp0=[]
  scroll=-max(0,all-(width*10-500)/zoom)
  len=0
  startrec=NaN
  focus=patt.length-1
  bpm=file.split("޶޶޶")[3].split("|||")[4]
  lask=''
      canvas.elt.oncontextmenu = () => false;
last=false
  rec=0
  playback=0
  scale(scalee)
}

function draw() {

  translate(0,-30)
  if (playback==0){
  if (patt.length==1&&patt[0]==NaN){
    patt=[0]
  }
  
  if (max(patt)==0){
    patt=[0]
  }  
  
  if (patt.length==0){
    patt=[0]
  }
  
  background("#101010");
  fill(0,0,255)
  rect(0,49,(patt.reduce((accumulator, currentValue) => accumulator + currentValue, 0)+scroll)*zoom*0.1+1,202)
  cumu=0
  y=-1
  for (x in patt){
    y+=patt[x]!=0
    fill(y%2*255)
    strokeWeight(2)
   stroke((focus==x&&patt[x]!=0)*255,0,0) 
    strokeWeight(1)
    rect((cumu+scroll*0.1)*zoom,50,patt[x]*zoom*0.1,200)
    stroke(0,0,0,0)
    if (patt[x]!=0 && (cumu+scroll*0.1)*zoom+patt[x]*zoom*0.1>textWidth(patt[x]/1000+"s")){
    fill((y*1+1)%2*255)
      widdd=0
      textSize(1)
      while(textWidth(patt[x]/1000+"s")<patt[x]*zoom*0.1&&textSize()<30){
        textSize(textSize()+1)
      }
      textSize(textSize()-5)
      
       realign=0
  if (patt[x]<width*5/zoom){
    realign=max(-8.333333*zoom,-10)
  }
    
    text(round(patt[x])/1000+"s",realign+max((cumu+scroll/10)*zoom+patt[x]*zoom/20-textWidth(round(patt[x])/1000+"s")/2,1*(textSize()/30)**0.1+5),150)
    
    }
    cumu+=patt[x]/10
    
    if (focus==x){
      qws=cumu
      focuspoint=(cumu+scroll*0.1)*zoom
    }
  }
  if (focus==-1){
    focuspoint=0
  }
fill(255,0,0)
  if (patt[focus]==0){
    fill(0,255,0)
  }
    circle(max(focuspoint,5),50,10)
  stroke(120)
  fill(255)
  textSize(20)
  textAlign(CENTER)
 z=10**round(log(width/zoom*10/5)/log(10))
  widd=ceil(scroll/-z)*z+ceil((width*10)/zoom/z)*z+z
  for (x=floor(scroll/-z)*z;x<widd;x+=z/(2**round(log(6/(width/zoom*10/z))/log(2)))){
    text(round(x/1000,1+round(log(1000)/log(z)))+"s",(x+scroll)*zoom*0.1,290)
  }
  for (x=floor(scroll/-z)*z;x<widd;x+=max(1,(2**floor(log((widd-floor(scroll/-z)*z)/(60000/bpm))/log(2)))/8)*60000/bpm){
        text(round(x/60000*bpm)+" beats",(x+scroll)*zoom*0.1,320)
  }
  textAlign(CENTER)
    textSize(30)
  textAlign(LEFT)
    
  if (rec){
    if (patt[focus]<3000){
  patt[focus]+=deltaTime
      if (mySound._playing==false){
    mySound.play()
        mySound.jump(qws/100)
  }
    }
    else{
  patt[focus]=3000
      mySound.stop()
    }
      if (last!=mouseIsPressed){
    focus+=1
    patt.splice(focus,0,0)
    
  }
     runsum=0
  patt.slice(0,focus+1).forEach((item)=>runsum+=item)
  scroll=-max(0,runsum-(width*10-500)/zoom)
  last=mouseIsPressed
  }
}
  else{
    sd=millis()-offf+(focuspoint/zoom-scroll/10)*10*(2-playback)
    if (sd-1000>=cumulat[cumulat.length-1]){
      playback=0
    }
background("#"+["000000","ffffff"][[cumulat,sd].flat().sort((a,b)=>(a-b)).indexOf(sd)%2])    
    fill("red")
    textAlign(CENTER)
    strokeWeight(0)
    textSize(70)
    text("Playback",width/2,100)
     if (sd>=cumulat[cumulat.length-1]){
 textSize(40)
    text("Playback finished",width/2,300)
     }
 textSize(30)
    text(round(min(sd,cumulat[cumulat.length-1])/1000,1)+" s",width/2,200)
    }
  }







function keyPressed(){
  bpmf=bpm*1
  if (bpmf==''){
    bpmf=60
  }
  if (rec==0&&playback==0){
  if (keyIsDown(CONTROL) && key == 'z'){
    if (nest<=prevstates.length-2){
    nest+=1
    patt=prevstates[prevstates.length-nest-1]
  }}
    else{
    nest=-1
    if (prevstates.length>=25){
  prevstates=prevstates.slice(1)
  prevstates.push([...patt])
    }
    else{
      if (prevstates.length==0||(patt.join(",")!=prevstates[prevstates.length-1].join(','))){
      prevstates.push([...patt])
      }
    }
  }
  if ("ArrowRight"==key){
    patt[focus]+=60000/bpmf
  }
  else if ("ArrowLeft"==key){
    patt[focus]-=60000/bpmf
    patt[focus]=constrain(patt[focus],0,Infinity)
    
  }
  else if ('ArrowUp'==key){
    patt[focus]+=60000/bpmf/8
    
  }
  else if ('ArrowDown'==key){
    patt[focus]-=60000/bpmf/8
    patt[focus]=constrain(patt[focus],0,Infinity)
    
  }
  else if (key=="Enter"){
      focus+=1
    
    patt.splice(focus,0,0)
    patt.splice(focus,0,0)
    
  }
  else if (key.toLowerCase()=="a"){
    focus-=1
    focus=max(focus,-1)
  }
  
  else if (key.toLowerCase()=="d"){
    focus+=1
    focus=min(focus,patt.length-1) 
  }
  else if (key.toLowerCase()=="z"){
    patt[focus]-=10 
  }
  
  else if (key.toLowerCase()=="c"){
        patt[focus]+=10
  }
  else if (key.toLowerCase()=="q"){
    patt[focus]-=100 
  }
  
  else if (key.toLowerCase()=="e"){
        patt[focus]+=100
  }
  else if (key.toLowerCase()=="x"){
    patt[focus]-=1
  }
  
  else if (key.toLowerCase()=="w"){
        patt[focus]+=1
  }
    

  else if (key<=5&&key!=0){
    print(patt.length)
    if (focus%2==1){
      patt[focus-1]=patt[focus-1]-20
      splice(patt,20.67,focus)
      focus+=1
    }
    ins=[]
    len=60000/bpm
    while (len<4234){
      len*=2
    }
    for (x=0;x<key*2-1;x++){
      ins.push((len-4234)/(key*2-1))
    }
    if (patt[patt.length-1]==0){
      patt.splice(-1)
      focus-=1
    }
    splice(patt,[3000,ins,1234].flat(),focus)
    patt=patt.flat()
  }
  }
  
  
   if (key.toLowerCase()=="p"){
     if (playback!=0){
       playback=0
     }
     else{
      playback=1+keyIsDown(CONTROL)*1
       
     }
    if (playback>=1){
      offf=millis()
    mySound.jump(focuspoint/100)
   mySound.play() 
    }
    else{
      mySound.stop()
    }
     return false;
   }
   if (key.toLowerCase()=="r"){
    
    rec+=1
    rec%=2
    if (rec==1){
      mySound.play()
      mySound.jump(focuspoint/100)
      if (focus!=0){
      focus+=1
      }
      startrec=focus
      print(focus)
      patt.splice(focus,0,0)
      temp=[]
    }
    else{
      mySound.stop()
      
snap=[...patt].splice(startrec,focus-startrec+1)
        snap=snap.map(item=>round(item/(60000/bpm/8))*60000/bpm/8)
      patt.splice(startrec,focus-startrec+1)
      
      patt.splice(startrec,0,snap)
      patt=patt.flat()
    focus+=1
    patt.splice(focus,0,0)
      print(startrec)
    }
  }
  else if (key=="Backspace"){
    if (lask=="r"&&rec==0){
      patt.splice(startrec,focus-startrec+1)
      focus=startrec
    }
    else if (rec==0){
patt.splice(focus,1)
  if (keyIsDown(CONTROL)){
      patt[focus-1]=patt[focus]+patt[focus*1-1]
patt.splice(focus*1,1)
      focus-=1
  }
  }
  }
  if (key!="Control"){
  runsum=0
  patt.slice(0,focus+1).forEach((item)=>runsum+=item)
  scroll=-max(0,runsum-(width*10-500)/zoom)
}
  if (patt[focus]<50&&patt[focus]!=20.67){
    patt[focus]=0
   // print("Invalid - too short!")
  }
  if (patt[focus]>3000&&patt[focus]!=3499){
    patt[focus]=3000
   // print("Invalid - too long!")
  }
  
  lask=key
  
}
function mouseWheel(){
  
  if (rec==0&&playback==0){
  if (keyIsDown(CONTROL)&&keyIsPressed){
    if (event.delta>0){
    scroll+=400/zoom
  }
  else{
    scroll-=400/zoom
  }
  }else{
  if (event.delta>0){
    zoom/=1.1
  }
  else{
    zoom*=1.1
  }
  }
  
  scroll=min(0,scroll)
  zoom=constrain(zoom,0.1,1000)
  }
    return false;
  
  
}

function wordify(){
  pat=[...patt]
  for (w in pat){
    if (pat[w]>1000){
      thinn=[]
for (vx=0;vx+1000<=pat[w];vx+=1000){
  print(pat[w])
thinn.push(1000)
thinn.push(0)
}
      if (pat[w]%1000!=0){
thinn.push(pat[w]%1000)
      }
      else{
        thinn=thinn.slice(0,-1)
      }
      pat[w]=thinn
    }
  }
  inv=0
  pat=pat.flat()
  wordd=pat.map(item=>String.fromCharCode(item+1)).join('')
  dw(wordd)
}

const dw = (content) => {
    // fileName consists the name of the file
    const text =content ;
    const element = document.createElement('a');
    const file = new Blob([text], {type: 'text/plain'});
    element.href = URL.createObjectURL(file);
    element.download = "1pix_map.1pix";
    document.body.appendChild(element);
    element.click();
    document.body.removeChild(element);
  };
    
    </script>
