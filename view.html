<script>
async function getText() {

 fetch('https://raw.githubusercontent.com/iamaverycoolperson29/songs/refs/heads/main/dtb.txt')

  .then(data =>
document.getElementById("10").innerHTML=data.split("\n").map(item=>item.split(",")).filter(item=>item[0]==mapperm[id][8])[0]
            ).then(something=>

)

async function idk(){
			document.getElementById("8").innerHTML=document.getElementById("10").innerHTML.split(',')[1]
			document.getElementById("9").innerHTML=document.getElementById("10").innerHTML.split(',')[2]
			document.getElementById("11").innerHTML=" (ID: "+document.getElementById("10").innerHTML.split(',')[0]+")"
}
getText()

id=parent.document.URL.substring(parent.document.URL.indexOf('?')+4, parent.document.URL.length);
function gotothegame(){
location.href="play?id="+id
}
// Source - https://stackoverflow.com/a/69025039
// Posted by Shalom Alexander
// Retrieved 2026-04-12, License - CC BY-SA 4.0



//maps=[["Map 0000000",49,10.67,191919],["sup3r 3p1c l3v3l",9,4,919191],["SUPER IMPOSSIBLE",0.9,17,112334]]

extract()
document.title=mapperm[id][0]+" - 1PIX"
document.getElementById("name").innerHTML=mapperm[id][0]
tot=0
mapperm[id][3].split("").forEach((item)=>tot+=item.codePointAt(0)-1)
tot/=1000
tot=Math.round(tot)
bg=tot%60+"s"
if (tot>=60){
bg=Math.floor(tot/60)+"m "+bg
}
document.getElementById(0).innerHTML=bg
document.getElementById(1).innerHTML=["clckr","scrlr","swppr","spmmr","ctrlr"][Math.floor(mapperm[id][7]**2/1000000/1000)]
document.getElementById(2).innerHTML=Math.round(find(mapperm[id][2])[0]/100)+"%"
if (find(mapperm[id][2])[0]==10000){
document.getElementById(2).innerHTML="FC"
}
document.getElementById(3).innerHTML=Math.round(find(mapperm[id][2])[3]/100)+"%"
document.getElementById(4).innerHTML=mapperm[id][2].length/4-1
document.getElementById(5).innerHTML=Math.round(mapperm[id][7]**2/1000000%1000)+" ms"
document.getElementById(6).innerHTML=mapperm[id][4].slice(2,4)*1+" CPS"
document.getElementById(7).innerHTML=mapperm[id][4].slice(0,2)*1+" CPS"

function extract(){
mapperm=[]
mapss=localStorage.getItem("maps").split("~~~~")
mapss=mapss.filter((x)=>x!='')
for (x in mapss){
io=mapss[x].split("޶޶޶")
q=[]
q.push(io[0])
q.push(io[6])
//q.push((io[3].charCodeAt(0)-913)/10)
q.push(io[7])
q.push(io[4].slice(0,-5))
q.push(io[2])
q.push(io[1])
q.push(x)
q.push(io[4].slice(-5))
q.push(io[3])
mapperm.push(q)
}
}



function find(h){
hh=h.replaceAll("杧","")
r={'noth':'0000','fcfc':'10000'}
kj=hh.match(/.{1,4}/g) ?? []
sum=0
kj.filter(item=>item!="noth").map(item => r[item] !== undefined ? r[item] : item).map(item=>item*1).forEach(item=>sum+=item)
return [Math.max(...kj.map(item => r[item] !== undefined ? r[item] : item).map(item=>item*1)),kj.reduce((total,x) => total+(x=="fcfc"), 0),kj.reduce((total,x) => total+(x=="noth"), 0)-1,sum / kj.length-1]
}
</script>
