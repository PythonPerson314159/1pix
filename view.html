function blouh(e){
ee=[...e].map(item=>item*1)
sum=0
streak=0
for (x=0;x<ee.length;x++){
if (ee.slice(x,x+5).join("w")=="1000w0w1000w0w1000"){
ee.splice(x,5,3000)
}
else if (ee.slice(x,x+3).join("w")=="1000w0w234"){
ee.splice(x,3,1234)
}
}
indices=[0]
for (m in ee){
if (ee[m]==3000||ee[m]==1234){
indices.push(m*1)
}
}
mme=[]
indices.forEach(i => 
mme.push(ee.slice(i,indices[indices.indexOf(i)*1+1]))
  );
  final=[]
  for (r=0;r<mme.length;r++){
  if (r%2==0){
  final.push(mme[r].reduce((a,b)=>a+b)-(1234*(r!=0)))
  }
  else{
  final.push(mme[r].length/2-1)
  }
  }
  return final
}

function find(hh){
r={'noth':'0000','fcfc':'10000'}
kj=hh.match(/.{1,4}/g) ?? []
sum=0
kj.filter(item=>item!="noth").map(item => r[item] !== undefined ? r[item] : item).map(item=>item*1).forEach(item=>sum+=item)
return [Math.max(...kj.map(item => r[item] !== undefined ? r[item] : item).map(item=>item*1)),kj.reduce((total,x) => total+(x=="fcfc"), 0),kj.reduce((total,x) => total+(x=="noth"), 0)-1,sum / kj.length-1]
}
