<script>
const content = document.querySelector(".content");
const fileInput = document.querySelector("input[type=file]");

fileInput.addEventListener("change", previewFile);

function previewFile() {
  const file = fileInput.files[0];
  const reader = new FileReader();
 
   
 
reader.readAsText(file)

reader.addEventListener("load", () => {
e=reader.result
if (localStorage.getItem("maps")==null){
localStorage.setItem("maps","")
}

  if (file.name.slice(-4)=="1pix") {
localStorage.setItem("maps",localStorage.getItem("maps")+e+"޶޶޶"+new Date()*1+"޶޶޶noth"+"杧杧杧")
  }
extract()
sortt()
}
)
}

</script>

<option value=7>alphabetical (Z -> A)</option>
</select><br><br>Search: 
<input id="thingy" onchange="console.log('e')"></input>

<script>
// Source - https://stackoverflow.com/a/69025039
// Posted by Shalom Alexander
// Retrieved 2026-04-12, License - CC BY-SA 4.0

document.getElementById('thingy').addEventListener('input',function(e){
        sortt()
        });



extract()
function extract(){
mapperm=[]
mapss=localStorage.getItem("maps").split("杧杧杧")
mapss=mapss.filter((x)=>x!='')
for (x in mapss){
io=mapss[x].split("޶޶޶")
q=[]
q.push(io[0])
q.push(io[6])
q.push(io[7])
q.push(io[4].slice(0,-5))
q.push(io[2])
q.push(io[1])
q.push(x)
q.push(io[4].slice(-5))
mapperm.push(q)
}
}

sortt()
function sortt(){
one=document.getElementById("sort").value
maps=mapperm.filter(item=>item[0].toLowerCase().includes(document.getElementById("thingy").value.toLowerCase()))
if (one==one%2){
maps.sort((a,b)=>b[6]-a[6])
}
if (one-one%2==2){
maps.sort((a,b)=>b[2]-a[2])
}
if (one-one%2==4){
maps.sort((a,b)=>b[7]-a[7])
}
if (one-one%2==6){
maps.sort(function (a, b) {
  if (a[0].toLowerCase() < b[0].toLowerCase()) {
    return -1;
  }
  else {
    return 1;
  }

});
}

if (one%2==1){
maps.reverse()
}

tot=''
for (x in maps){
if (maps[x][2]<12){
difff=Math.floor(maps[x][2])+"★"
}
else{
difff="Extreme"
}

bestt=Math.round(find(maps[x][2])[0]/100)

tot+="<div class=mega id="+x+" onclick=''><span class='a'><big>"+maps[x][0]+"</big><br>"+bestt+"% acc.</span><span class=e><button onclick=location.href='view.html?id="+maps[x][6]+"' >Play</button></span></div>"
}

document.getElementById("bigbig").innerHTML=tot
}


/*function ext(e){
tot=0
maps[e][3].split("").forEach((item)=>tot+=item.codePointAt(0)-1)
tot/=1000
tot=Math.round(tot)

auto="<span class='a'><big>"+maps[e][0]+"</big><br>"+maps[e][1]+"% acc.</span><span class=e>"+difff+"</span>"
document.getElementById(e).innerHTML=auto+"<div><br><br><br><hr><p><span class=e><button>Play</button></span>"+maps[e][5]+"</p><p class=p>Length: "+tot+" seconds</p><p class=p>Added: "+new Date(maps[e][3]/1).toDateString().slice(4)+"</p></div>"
}*/

function find(hh){
r={'noth':'0000','fcfc':'10000'}
kj=hh.match(/.{1,4}/g) ?? []
return [Math.max(...kj.map(item => r[item] !== undefined ? r[item] : item).map(item=>item*1)),kj.reduce((total,x) => total+(x=="fcfc"), 0),kj.reduce((total,x) => total+(x=="noth"), 0)-1]
}
</script>
