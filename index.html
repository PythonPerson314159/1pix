function extract(){
mapperm=[]
mapss=localStorage.getItem("maps").split("杧杧杧")
mapss=mapss.filter((x)=>x!='')
for (x in mapss){
io=mapss[x].split("޶޶޶")
q=[]
q.push(io[0])
q.push(io[6])
//q.push((io[3].charCodeAt(0)-913)/10)
q.push(io[7])
q.push(io[4].slice(0,-5))
q.push(io[2])
q.push(io[1])
q.push(x)
q.push(parseInt(io[4].slice(-1),16))
if (io[4].slice(-1)=="!"){
q[7]="199"
}
mapperm.push(q)
}
}



sortt()
function sortt(){
one=document.getElementById("sort").value
maps=mapperm.filter(item=>item[0].toLowerCase().includes(document.getElementById("thingy").value.toLowerCase()))
if (one==one%2){
maps.sort((a,b)=>b[6].replace(/\D/g, '')-a[6].replace(/\D/g, ''))
}
if (one-one%2==2){
maps.sort((a,b)=>b[7]*((b[7]!=199))-a[7]*((a[7]!=199)))
}
if (one-one%2==4){
maps.sort((a,b)=>b[7]-a[7])
}
if (one-one%2==6){
maps.sort(function (a, b) {
  if (a[0].toLowerCase() < b[0].toLowerCase()) {
    return -1;
  }
  else {
    return 1;
  }

});
}

if (one%2==1){
maps.reverse()
if (one=3){
maps.sort((a,b)=>a[7]*((a[7]==199)+1)-b[7]*((b[7]==199)+1))
}
}

tot=''
for (x in maps){

difff=Math.floor(maps[x][2])+"★"
}
else{
difff="Extreme"
}

bestt=Math.round(find(maps[x][2])[0]/100)
mppr=maps[x][5].split("|||")[1]
if (mppr==""){mppr="???"}
tot+="<div class=mega id="+x+" onclick=''><span class='a'><span class=d><big>"+maps[x][0]+"</big> By&nbsp;"+mppr+"</span><span>"+translatee(maps[x][7])+"</span><br><tiny>"+bestt+"% acc.</tiny><br></span><span class=e><button onclick=location.href='view.html?id="+maps[x][6]+"' >Play<br><tiny>"+["","or edit"][maps[x][1].includes("yours")*1]+"</tiny></button></span></div>"
}

document.getElementById("bigbig").innerHTML=tot
}

function translatee(e){if(e==199){return ""}else if (e<=11){return "<br>"+e+"*"}else{return "<br>Extreme "+(e-12)}}

}*/

function find(hh){
r={'noth':'0000','fcfc':'10000'}
kj=hh.match(/.{1,4}/g) ?? []
return [Math.max(...kj.map(item => r[item] !== undefined ? r[item] : item).map(item=>item*1)),kj.reduce((total,x) => total+(x=="fcfc"), 0),kj.reduce((total,x) => total+(x=="noth"), 0)-1]
}
